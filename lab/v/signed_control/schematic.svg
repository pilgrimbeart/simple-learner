<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650"><rect width="1100" height="650" fill="white"/><g font-family="sans-serif" fill="#222"><text x="25" y="30" font-size="23">D145: explicit complementary gates for signed control</text>
