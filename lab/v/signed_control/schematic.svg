<text x="33" y="115" font-size="15">C=25 pF</text>
<text x="33" y="142" font-size="15">R=0.2 Gohm</text>
<text x="33" y="169" font-size="15">bias=0 pA</text>
<rect x="240" y="65" width="195" height="120" fill="#eef5f8" stroke="#222"/>
