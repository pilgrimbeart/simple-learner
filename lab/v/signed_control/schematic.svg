<text x="25" y="527">E3: node 0 to 4; gain=-750 pA; slope=3.333/V; offset=0 V; gate=3</text>
<text x="25" y="590">Dashed lines: control ports. Every state is noisy. No implicit filters, exact inversion or baseline subtraction.</text></g></svg>