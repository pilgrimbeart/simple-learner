<rect x="340" y="120" width="210" height="90" fill="#eef5f8" stroke="#222"/><text x="352" y="145" font-size="18">eligibility</text><text x="352" y="170">C = 25 pF</text><text x="352" y="193">R = 2 Gohm</text>
