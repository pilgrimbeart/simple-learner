<text x="30" y="520">Every control gate: clip(voltage / .3 V, 0, 1). Write driver dead zone: .01 × full current.</text><text x="30" y="550">Bench currents enter evidence, eligibility and probe only. All nodes retain the existing substrate noise.</text></g></svg>