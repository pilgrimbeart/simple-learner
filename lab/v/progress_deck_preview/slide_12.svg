<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="750" viewBox="0 0 1333 750"><rect width="1333" height="750" fill="white"/><rect x="0" y="0" width="1333.3" height="16.0" fill="#142B43" rx="0"/><text x="60.0" y="77.05555555555556" font-family="Arial,sans-serif" font-size="40.27777777777778" font-weight="bold" fill="#142B43">Next steps: explanation before expansion</text><rect x="65.0" y="155.0" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="174.38888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">Choose the causal question worth answering</text><text x="95.0" y="220.55555555555554" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">Use the new measurements to decide between direct forecasts, preservation and</text><text x="95.0" y="255.0" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">changed observations. Freeze one test.</text><rect x="65.0" y="320.0" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="339.3888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">Reconnect the result to general scaling</text><text x="95.0" y="385.55555555555554" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">Retain only capabilities with a clear purpose, evidence and cost. Compare tuning,</text><text x="95.0" y="420.0" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">recycling and growth fairly.</text><rect x="65.0" y="484.99999999999994" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="504.3888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">Validate only after an exploratory benefit is credible</text><text x="95.0" y="550.5555555555555" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">Then use fresh seeds, step refinement and declared practical margins. Keep</text><text x="95.0" y="585.0" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">genuinely new families protected.</text><rect x="60.0" y="693.0" width="1210.0" height="1.2" fill="#CDD6DF" rx="0"/><text x="60.0" y="715.7777777777778" font-family="Arial,sans-serif" font-size="13.88888888888889" font-weight="normal" fill="#5B6572">Research recommendations, not permission to open protected tests or launch a sweep</text><text x="1200" y="716.0555555555555" font-family="Arial,sans-serif" font-size="15.277777777777779" font-weight="normal" fill="#5B6572">12/13</text></svg>