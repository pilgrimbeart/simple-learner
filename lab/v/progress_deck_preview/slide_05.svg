<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="750" viewBox="0 0 1333 750"><rect width="1333" height="750" fill="white"/><rect x="0" y="0" width="1333.3" height="16.0" fill="#142B43" rx="0"/><text x="60.0" y="77.05555555555556" font-family="Arial,sans-serif" font-size="40.27777777777778" font-weight="bold" fill="#142B43">The most durable discoveries</text><rect x="65.0" y="155.0" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="174.38888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">Information has to reach useful action</text><text x="95.0" y="220.55555555555554" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">Predictability alone can reward unhelpful behaviour. Movement changes what can</text><text x="95.0" y="255.0" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">be learned.</text><rect x="65.0" y="320.0" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="339.3888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">Score the prediction that was actually issued</text><text x="95.0" y="385.55555555555554" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">Learning and recycling can change a speaker before credit arrives. Correct timing</text><text x="95.0" y="420.0" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">matters.</text><rect x="65.0" y="484.99999999999994" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="504.3888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">A capacity setting is not a material bill</text><text x="95.0" y="550.5555555555555" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">Fixed machinery, actual occupancy, activity and global scans need separate</text><text x="95.0" y="585.0" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">accounts.</text><rect x="60.0" y="693.0" width="1210.0" height="1.2" fill="#CDD6DF" rx="0"/><text x="60.0" y="715.7777777777778" font-family="Arial,sans-serif" font-size="13.88888888888889" font-weight="normal" fill="#5B6572">Sources: discrete D44–D54, D73–D82; README findings</text><text x="1200" y="716.0555555555555" font-family="Arial,sans-serif" font-size="15.277777777777779" font-weight="normal" fill="#5B6572">5/13</text></svg>