<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="750" viewBox="0 0 1333 750"><rect width="1333" height="750" fill="white"/><rect x="0" y="0" width="1333.3" height="16.0" fill="#142B43" rx="0"/><text x="60.0" y="77.05555555555556" font-family="Arial,sans-serif" font-size="40.27777777777778" font-weight="bold" fill="#142B43">What would count as success?</text><rect x="65.0" y="160.0" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="179.38888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">Learn in life</text><text x="95.0" y="225.55555555555554" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">Approach a strong, explicitly informed reference on unfamiliar challenges.</text><rect x="65.0" y="325.0" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="344.3888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">Scale with a frozen design</text><text x="95.0" y="390.55555555555554" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">Additional resources extend capability across families and retain simpler skills.</text><rect x="65.0" y="489.99999999999994" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="509.3888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">Pay the full cost</text><text x="95.0" y="555.5555555555555" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">Evidence, learning time, material, energy and communication all count. Locality</text><text x="95.0" y="590.0" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">must survive growth.</text><rect x="60.0" y="693.0" width="1210.0" height="1.2" fill="#CDD6DF" rx="0"/><text x="60.0" y="715.7777777777778" font-family="Arial,sans-serif" font-size="13.88888888888889" font-weight="normal" fill="#5B6572">Sources: README goal and scaling test; GRAMMAR evaluation protocol</text><text x="1200" y="716.0555555555555" font-family="Arial,sans-serif" font-size="15.277777777777779" font-weight="normal" fill="#5B6572">2/13</text></svg>