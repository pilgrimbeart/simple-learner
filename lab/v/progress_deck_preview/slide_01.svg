<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="750" viewBox="0 0 1333 750"><rect width="1333" height="750" fill="white"/><rect x="0" y="0" width="1333.3" height="16.0" fill="#142B43" rx="0"/><text x="60.0" y="77.05555555555556" font-family="Arial,sans-serif" font-size="40.27777777777778" font-weight="bold" fill="#142B43">The original goal: intelligence that scales</text><text x="80.0" y="206.0" font-family="Arial,sans-serif" font-size="50.0" font-weight="bold" fill="#0072B2">“To solve a bigger problem, just add</text><text x="80.0" y="268.0" font-family="Arial,sans-serif" font-size="50.0" font-weight="bold" fill="#0072B2">more brain.”</text><text x="80.0" y="366.94444444444446" font-family="Arial,sans-serif" font-size="34.72222222222222" font-weight="normal" fill="#142B43">One reusable design that learns and reorganises during life,</text><text x="80.0" y="410.0" font-family="Arial,sans-serif" font-size="34.72222222222222" font-weight="normal" fill="#142B43">without us inventing a new solution for each unfamiliar problem.</text><text x="80.0" y="558.1111111111111" font-family="Arial,sans-serif" font-size="30.555555555555557" font-weight="normal" fill="#5B6572">Progress: useful capabilities and sharper explanations. General, economical</text><text x="80.0" y="596.0" font-family="Arial,sans-serif" font-size="30.555555555555557" font-weight="normal" fill="#5B6572">scaling is still unproved.</text><rect x="60.0" y="693.0" width="1210.0" height="1.2" fill="#CDD6DF" rx="0"/><text x="60.0" y="715.7777777777778" font-family="Arial,sans-serif" font-size="13.88888888888889" font-weight="normal" fill="#5B6572">Research review • 18 November 2026 • README: The goal</text><text x="1200" y="716.0555555555555" font-family="Arial,sans-serif" font-size="15.277777777777779" font-weight="normal" fill="#5B6572">1/13</text></svg>