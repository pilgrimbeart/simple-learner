<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="750" viewBox="0 0 1333 750"><rect width="1333" height="750" fill="white"/><rect x="0" y="0" width="1333.3" height="16.0" fill="#142B43" rx="0"/><text x="60.0" y="77.05555555555556" font-family="Arial,sans-serif" font-size="40.27777777777778" font-weight="bold" fill="#142B43">Why we investigated memory allocation</text><text x="85.0" y="184.5" font-family="Arial,sans-serif" font-size="37.5" font-weight="bold" fill="#0072B2">Extra memory is valuable in some streams, but the</text><text x="85.0" y="231.0" font-family="Arial,sans-serif" font-size="37.5" font-weight="bold" fill="#0072B2">allocator often sends it elsewhere.</text><rect x="65.0" y="310.0" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="329.3888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">A hand-informed allocation is a useful reference</text><text x="95.0" y="375.55555555555554" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">It recovers much of the larger brain’s sequence performance, but supplies</text><text x="95.0" y="410.0" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">knowledge the brain must discover.</text><rect x="65.0" y="480.0" width="12.0" height="12.0" fill="#0072B2" rx="0"/><text x="95.0" y="499.3888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="bold" fill="#142B43">Retention and weighting have not supplied a general cure</text><text x="95.0" y="545.5555555555555" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">Reappearing memories are not automatically useful. Hindsight winners and small</text><text x="95.0" y="580.0" font-family="Arial,sans-serif" font-size="27.77777777777778" font-weight="normal" fill="#5B6572">replay effects are not causal proofs.</text><rect x="60.0" y="693.0" width="1210.0" height="1.2" fill="#CDD6DF" rx="0"/><text x="60.0" y="715.7777777777778" font-family="Arial,sans-serif" font-size="13.88888888888889" font-weight="normal" fill="#5B6572">Sources: discrete D76–D78, D93–D108</text><text x="1200" y="716.0555555555555" font-family="Arial,sans-serif" font-size="15.277777777777779" font-weight="normal" fill="#5B6572">6/13</text></svg>