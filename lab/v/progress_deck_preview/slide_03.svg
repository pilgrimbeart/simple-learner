<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="750" viewBox="0 0 1333 750"><rect width="1333" height="750" fill="white"/><rect x="0" y="0" width="1333.3" height="16.0" fill="#142B43" rx="0"/><text x="60.0" y="77.05555555555556" font-family="Arial,sans-serif" font-size="40.27777777777778" font-weight="bold" fill="#142B43">A small robot makes the problem observable</text><rect x="100" y="200" width="270.0" height="130.0" fill="#EAF1F6" rx="0"/><text x="118.0" y="269.5" font-family="Arial,sans-serif" font-size="37.5" font-weight="bold" fill="#0072B2">World</text><rect x="455.0" y="200" width="270.0" height="130.0" fill="#EAF1F6" rx="0"/><text x="472.99999999999994" y="269.5" font-family="Arial,sans-serif" font-size="37.5" font-weight="bold" fill="#0072B2">Brain</text><rect x="810.0" y="200" width="270.0" height="130.0" fill="#EAF1F6" rx="0"/><text x="827.9999999999999" y="269.5" font-family="Arial,sans-serif" font-size="37.5" font-weight="bold" fill="#0072B2">Action</text><text x="377.0" y="275.77777777777777" font-family="Arial,sans-serif" font-size="38.888888888888886" font-weight="normal" fill="#142B43">→</text><text x="732.0" y="275.77777777777777" font-family="Arial,sans-serif" font-size="38.888888888888886" font-weight="normal" fill="#142B43">→</text><text x="90.0" y="399.3888888888889" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="normal" fill="#142B43">Two sensors, two motors, one food/poison taste. Wiring varies each life.</text><text x="90.0" y="439.0" font-family="Arial,sans-serif" font-size="31.944444444444443" font-weight="normal" fill="#142B43">Actions change the evidence the brain receives.</text><text x="90.0" y="551.8333333333334" font-family="Arial,sans-serif" font-size="29.166666666666668" font-weight="normal" fill="#5B6572">Challenges include sequences, timing and combinations. Same seed helps</text><text x="90.0" y="588.0" font-family="Arial,sans-serif" font-size="29.166666666666668" font-weight="normal" fill="#5B6572">pair lives; it does not make their observations identical.</text><rect x="60.0" y="693.0" width="1210.0" height="1.2" fill="#CDD6DF" rx="0"/><text x="60.0" y="715.7777777777778" font-family="Arial,sans-serif" font-size="13.88888888888889" font-weight="normal" fill="#5B6572">Sources: AGENTS ground rules; README; GRAMMAR</text><text x="1200" y="716.0555555555555" font-family="Arial,sans-serif" font-size="15.277777777777779" font-weight="normal" fill="#5B6572">3/13</text></svg>