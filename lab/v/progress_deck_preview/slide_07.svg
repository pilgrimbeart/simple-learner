<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="750" viewBox="0 0 1333 750"><rect width="1333" height="750" fill="white"/><rect x="0" y="0" width="1333.3" height="16.0" fill="#142B43" rx="0"/><text x="60.0" y="77.05555555555556" font-family="Arial,sans-serif" font-size="40.27777777777778" font-weight="bold" fill="#142B43">The recent test changed one admission rule</text><text x="85.0" y="181.94444444444446" font-family="Arial,sans-serif" font-size="34.72222222222222" font-weight="normal" fill="#142B43">Old rule: a donor must delete a unit to transfer allowance—even if</text><text x="85.0" y="225.0" font-family="Arial,sans-serif" font-size="34.72222222222222" font-weight="normal" fill="#142B43">it has spare allowance and no unit to delete.</text><text x="85.0" y="336.94444444444446" font-family="Arial,sans-serif" font-size="34.72222222222222" font-weight="normal" fill="#0072B2">Tested change: allow that spare allowance to move without</text><text x="85.0" y="380.0" font-family="Arial,sans-serif" font-size="34.72222222222222" font-weight="normal" fill="#0072B2">deletion. Keep the price, donor draw and credit contract fixed.</text><text x="85.0" y="491.83333333333337" font-family="Arial,sans-serif" font-size="29.166666666666668" font-weight="normal" fill="#5B6572">Both arms: cap 2300 units; sequence and timing challenges; ten opened seed</text><text x="85.0" y="528.0000000000001" font-family="Arial,sans-serif" font-size="29.166666666666668" font-weight="normal" fill="#5B6572">pairs. All-food controls match exactly. This remains a software diagnostic with</text><text x="85.0" y="564.1666666666667" font-family="Arial,sans-serif" font-size="29.166666666666668" font-weight="normal" fill="#5B6572">global scans.</text><rect x="60.0" y="693.0" width="1210.0" height="1.2" fill="#CDD6DF" rx="0"/><text x="60.0" y="715.7777777777778" font-family="Arial,sans-serif" font-size="13.88888888888889" font-weight="normal" fill="#5B6572">Sources: discrete D109–D118; spare_allowance.py</text><text x="1200" y="716.0555555555555" font-family="Arial,sans-serif" font-size="15.277777777777779" font-weight="normal" fill="#5B6572">7/13</text></svg>